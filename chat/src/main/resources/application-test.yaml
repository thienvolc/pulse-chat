spring:
  datasource:
    url: jdbc:h2:mem:pulse_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: pulse-chat-realtime-test
      auto-offset-reset: latest
  jpa:
    hibernate:
      ddl-auto: create-drop

security:
  jwt:
    secret: "change-this-secret-key-to-at-least-32-characters"
    expiration-seconds: 3600

app:
  events:
    mode: local
    topic: chat.messages.created
    fallback-on-kafka-error: true
  message-policy:
    min-length: 1
    max-length: 2000
    max-messages-per-window: 50
    window-seconds: 10
    duplicate-cooldown-seconds: 1
  outbox:
    worker-delay-ms: 5000
    retry:
      max-retries: 3
      max-backoff-seconds: 1
      step-backoff-seconds: 1
  realtime:
    instance-id: pulse-chat-test
